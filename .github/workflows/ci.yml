name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Node 26
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '26'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test JavaScript and emote assets
      run: npm test

    - name: Test PHP emote contracts
      run: npm run test:php

    - name: Build
      run: make build

    - name: Deploy Build
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: nightly
        publish_dir: ./build
        allow_empty_commit: false
        enable_jekyll: true

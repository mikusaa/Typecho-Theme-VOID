name: Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Node 26
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '26'
        cache: 'npm'

    - name: Set up PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: none

    - name: Verify source and production build
      run: make verify

    - name: Upload production build
      uses: actions/upload-artifact@v4
      with:
        name: void-build-${{ github.sha }}
        path: build/
        if-no-files-found: error
        retention-days: 7

  php-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.0', '8.5']

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Node 26
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '26'

    - name: Set up PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none

    - name: Check PHP syntax and contracts
      run: |
        npm run lint:php
        npm run test:php

  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, php-contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-nightly
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Download verified production build
      uses: actions/download-artifact@v4
      with:
        name: void-build-${{ github.sha }}
        path: build/

    - name: Publish nightly
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: nightly
        publish_dir: ./build
        allow_empty_commit: false
        enable_jekyll: true
